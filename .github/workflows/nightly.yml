name: nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/nightly.yml]

env:
  # `-skx`: Intel SDE emulates Skylake-X, the oldest CPU with AVX-512F and BMI2
  FASTLEAVES_REQUIRE_AVX512: "1"

permissions:
  contents: read

jobs:
  # The whole Python suite on the fast kernel, on Intel's AVX-512 emulator (too slow for every PR).
  avx512:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Intel SDE (AVX-512 emulator)
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - run: echo "$SDE_PATH" >> "$GITHUB_PATH"
      - run: pip install ".[test]"
      # one process: SDE cannot follow pytest-xdist's workers into a new python
      - run: sde64 -skx -- python -m pytest -n 0

  # Mutation test: cargo-mutants changes the Rust code in one place at a time (`<` to `<=`, a
  # function body to a constant, ...), and some test must fail for each change. Stage 1: the
  # Rust tests, the kernel on the emulator. Stage 2 (tests/mutants.py): pytest, scalar path,
  # on the mutants stage 1 misses. Fails when more survive than tests/mutants-survivors.txt lists,
  # and then opens an issue (or comments on the open one) so the failure is seen.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Intel SDE (AVX-512 emulator)
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - run: echo "$SDE_PATH" >> "$GITHUB_PATH"
      - run: cargo install cargo-mutants --locked --version 27.1.0
      - name: "Stage 1: Rust tests, AVX-512 kernel on the emulator"
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sde64 -skx --
        # exit code 2: some mutants missed, 3: some timed out (caught); both go on to stage 2.
        # 4 means the tests fail without mutations. No annotations: stage 2 catches most of the
        # mutants stage 1 misses, so they would show as warnings on code that is tested.
        run: cargo mutants --cargo-arg=--release --timeout 900 -j 4 --annotations none || test $? -le 3
      - run: pip install -e ".[test]"
      - name: "Stage 2: pytest on the mutants stage 1 missed, scalar path"
        env:
          FASTLEAVES_ISA: scalar
          FASTLEAVES_REQUIRE_AVX512: "" # set for the whole workflow; the scalar path is wanted here
        run: python tests/mutants.py mutants.out/outcomes.json 2>&1 | tee mutants.out/pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: mutants.out
      # For each new survivor the maintainer decides: a test that catches it, or an entry in
      # tests/mutants-survivors.txt with the reason. Not for runs on pull requests.
      - name: Issue on failure
        if: failure() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly mutation test failed"
          survivors=$(sed -n '/^More than/,$p' mutants.out/pytest.txt 2>/dev/null || true)
          body="Run: $RUN

          ${survivors:-The job failed before judging the survivors (build, baseline or timeout); see the run.}

          For each new survivor: add a test that catches it, or add it to \`tests/mutants-survivors.txt\` with the reason."
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
