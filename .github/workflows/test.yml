name: test
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # A pull request that changes only documentation (*.md, LICENSE) skips the jobs test and
  # avx512. The ruleset requires only ci-ok, which passes when they pass or are skipped.
  # Pushes to main always test.
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2 # the merge commit and its first parent, the base branch
      - id: diff
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1 HEAD | tee changed
          if grep -v -E '(\.md|^LICENSE)$' changed; then echo docs_only=false; else echo docs_only=true; fi >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: cargo test --release
      - run: FASTLEAVES_ISA=scalar cargo test --release
      - run: pip install ".[test]"
      - name: pytest (fast path if the CPU has AVX-512, see the report header)
        run: pytest
      - name: pytest (scalar path)
        run: FASTLEAVES_ISA=scalar pytest

  # GitHub's runners may lack AVX-512, so the fast kernel runs on Intel's emulator.
  # Only the test binaries are emulated; the full pytest suite runs there nightly.
  avx512:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    env:
      # `-skx`: Intel SDE emulates Skylake-X, the oldest CPU with AVX-512F and BMI2
      FASTLEAVES_REQUIRE_AVX512: "1"
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sde64 -skx --
    steps:
      - uses: actions/checkout@v4
      - name: Intel SDE (AVX-512 emulator)
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0
        with:
          environmentVariableName: SDE_PATH
          sdeVersion: 10.13.1
      - run: echo "$SDE_PATH" >> "$GITHUB_PATH"
      - run: cargo test --release

  # The one required check: fails if any job above failed or was cancelled.
  ci-ok:
    if: always()
    needs: [changes, test, avx512]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
